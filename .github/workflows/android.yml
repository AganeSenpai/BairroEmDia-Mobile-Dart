name: Gerar e verificar APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.14.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verificar e compilar Dart
        run: |
          dart pub get
          dart analyze
          dart run tool/prepare_android.dart
      - name: Gerar APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Publicar APK de demonstracao
        uses: actions/upload-artifact@v4
        with:
          name: BairroEmDia-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verificar no emulador Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: python3 tool/check_android.py
      - name: Publicar evidencias do emulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BairroEmDia-Android-Evidencias
          path: android-evidence/
          if-no-files-found: warn
